<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery – risx</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23000'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #000;
      --muted: #7a809a;
      --line: #b9b9b9;
      --bg: #fff;
      --placeholder: #f1f2f3;
      --container: 900px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Roboto", Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(100% - 48px, var(--container));
      margin-inline: auto;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ---------- Load animations ---------- */
    @keyframes fade-down { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    @keyframes fade-up   { from { opacity: 0; transform: translateY(22px); }  to { opacity: 1; transform: none; } }
    @keyframes word-up   { from { transform: translateY(110%); } to { transform: none; } }
    @keyframes reveal    { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes settle    { from { transform: scale(1.25); } to { transform: scale(1); } }
    @keyframes draw      { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .in-down, .in-up {
      animation-duration: 0.9s;
      animation-timing-function: var(--ease);
      animation-fill-mode: both;
      animation-delay: var(--d, 0s);
    }
    .in-down { animation-name: fade-down; }
    .in-up   { animation-name: fade-up; }

    /* ---------- Header ---------- */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-block: 14px;
    }

    .logo { display: inline-block; justify-self: start; }
    .logo img { display: block; width: 60px; height: auto; }

    .nav { display: flex; gap: 28px; font-size: 0.75rem; font-weight: 500; }
    .nav a { padding-block: 4px; }
    .nav a:hover,
    .nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 4px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding-inline: 32px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      border: 1px solid var(--ink);
      transition: background 0.25s, color 0.25s, transform 0.35s var(--ease);
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    .btn-outline { background: #fff; justify-self: end; min-width: 76px; }
    .btn-outline:hover { background: var(--ink); color: #fff; }
    .btn-solid { background: var(--ink); color: #fff; min-width: 154px; }
    .btn-solid:hover { background: #222; }

    /* ---------- Hero (gallery): image left 1:1, text right ---------- */
    .hero {
      flex: 1;
      display: grid;
      align-content: center;      /* keeps the hero in the middle; extra space goes above and below */
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      column-gap: 72px;
      align-items: center;
      padding-block: 40px;
    }

    .art {
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      max-width: 420px;
      justify-self: end;
      aspect-ratio: 1 / 1;
      border-radius: 6px;
      background: var(--placeholder);
      overflow: hidden;
      animation: reveal 1.2s var(--ease) 0.4s both;
    }
    .art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: settle 1.8s var(--ease) 0.4s both;
    }

    .hero-copy {
      grid-column: 2;
      grid-row: 1;
      max-width: 340px;
    }
    .hero-copy h1 {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 20px;
    }
    .w {
      display: inline-block;
      overflow: hidden;
      vertical-align: top;
      padding-bottom: 0.14em;
      margin-bottom: -0.14em;
    }
    .w > span {
      display: inline-block;
      animation: word-up 1s var(--ease) both;
      animation-delay: var(--d, 0s);
    }
    .hero-copy p {
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 2.1;
      margin-bottom: 24px;
    }

    /* ---------- Footer ---------- */
    .footer {
      position: relative;
      margin-top: 24px;
      padding-block: 28px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.625rem;
      color: var(--muted);
    }
    .footer::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: var(--line);
      transform-origin: left;
      animation: draw 1.2s var(--ease) 1.1s both;
    }
    .follow { display: flex; align-items: center; gap: 8px; font-size: 0.8125rem; }
    .follow a {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      color: var(--ink);
      transition: transform 0.35s var(--ease), box-shadow 0.35s;
    }
    .follow a:hover { transform: translateY(-2px) rotate(-6deg); box-shadow: 0 6px 14px rgba(0,0,0,0.22); }

    /* ---------- Contact tooltip ---------- */
    .contact { position: relative; justify-self: end; }
    button.btn { font-family: inherit; cursor: pointer; }
    .tooltip {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      z-index: 10;
      display: grid;
      gap: 2px;
      padding: 10px 16px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-size: 0.8125rem;
      white-space: nowrap;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top right;
      transition: opacity 0.25s, transform 0.4s var(--ease), visibility 0s 0.4s;
    }
    .tooltip::before {
      content: "";
      position: absolute;
      top: -5px;
      right: 34px;
      width: 10px;
      height: 10px;
      background: var(--ink);
      transform: rotate(45deg);
      border-radius: 2px;
    }
    .tooltip.show {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity 0.25s, transform 0.4s var(--ease);
    }
    .tip-note { font-size: 0.6875rem; color: #9aa0b8; display: none; }
    .tooltip.copied .tip-note { display: block; }

    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* ---------- Tablet / mobile ---------- */
    @media (max-width: 820px) {
      .header { grid-template-columns: 1fr auto; row-gap: 10px; }
      .nav { grid-column: 1 / -1; grid-row: 2; justify-content: center; }

      .hero {
        grid-template-columns: 1fr;
        row-gap: 28px;
        padding-block: 28px;
      }
      .art { grid-column: 1; grid-row: 1; max-width: 420px; justify-self: center; }
      .hero-copy { grid-column: 1; grid-row: 2; max-width: 420px; justify-self: center; width: 100%; }
      .hero-copy h1 { font-size: clamp(2rem, 9vw, 2.5rem); }
      .hero-copy p { line-height: 1.9; }
      .hero-copy .btn { width: 100%; }
    }

    @media (max-width: 480px) {
      .footer { flex-direction: column; gap: 14px; align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <a href="index.html" class="logo in-down" style="--d:.1s" aria-label="risx home"><img src="logo.png" alt="risx"></a>
      <nav class="nav" aria-label="Main">
        <a href="index.html" class="in-down" style="--d:.2s">Home</a>
        <a href="gallery.html" class="in-down" style="--d:.3s" aria-current="page">Gallery</a>
      </nav>
      <div class="contact in-down" style="--d:.4s">
        <button type="button" class="btn btn-outline" id="contactBtn" aria-expanded="false" aria-describedby="contactTip">Contact</button>
        <div class="tooltip" id="contactTip" role="tooltip">
          <span class="tip-email">setia_aris@rocketmail.com</span>
          <span class="tip-note" id="tipNote">Email copied</span>
        </div>
      </div>
    </header>

    <main class="hero">
      <div class="art">
        <img src="image2.png" alt="Illustration by risx">
      </div>

      <div class="hero-copy">
        <h1 aria-label="WHO AM I?">
          <span class="w" aria-hidden="true"><span style="--d:.5s">WHO AM I?</span></span>
        </h1>
        <p class="in-up" style="--d:1s">I mainly specialize in UX design, but I also create flat design or illustrations to complement the visual content of websites. In addition, I do write code for websites</p>
        <a href="https://dribbble.com/therisx" target="_blank" rel="noopener noreferrer" class="btn btn-solid in-up" style="--d:1.15s">See the gallery</a>
      </div>
    </main>

    <footer class="footer" id="contact">
      <span class="in-up" style="--d:1.3s">Copyright © 2026. All Rights Reserved</span>
      <div class="follow in-up" style="--d:1.4s">
        Follow on
        <a href="https://x.com/schaltcuz/" aria-label="Follow on X" target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
      </div>
    </footer>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('contactBtn');
      var tip = document.getElementById('contactTip');
      var email = tip.querySelector('.tip-email').textContent;

      function close() {
        tip.classList.remove('show', 'copied');
        btn.setAttribute('aria-expanded', 'false');
      }

      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (tip.classList.contains('show')) return close();
        tip.classList.add('show');
        btn.setAttribute('aria-expanded', 'true');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(function () {
            tip.classList.add('copied');
          }).catch(function () {});
        }
      });

      document.addEventListener('click', function (e) {
        if (!tip.contains(e.target)) close();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
